<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortex 互動 Demo v0.13 · 角色工作區制</title>
<style>
  :root{
    --ink:#0B1F3A; --text:#374755; --muted:#6B7280; --line:#E5E7EB;
    --ocean:#02C39A; --navy:#1C7293; --bg:#F4F6F9; --bg-soft:#FAFBFC; --white:#fff;
    --gold:#CA8A04; --red:#DC2626; --green:#16A34A; --purple:#7C3AED; --cyan:#0891B2; --sky:#0EA5E9; --amber:#F5A524;
    --font:-apple-system,"Microsoft JhengHei","Segoe UI",sans-serif;
    --mono:"Consolas","SF Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;}
  .mono{font-family:var(--mono);}
  /* ===== Top bar ===== */
  .topbar{height:54px;background:var(--ink);display:flex;align-items:center;gap:16px;padding:0 18px;color:#fff;position:sticky;top:0;z-index:50;}
  .logo{font-size:18px;font-weight:800;letter-spacing:0.5px;}
  .logo .v{font-size:10px;background:var(--ocean);color:var(--ink);padding:2px 6px;border-radius:6px;margin-left:8px;font-weight:700;vertical-align:middle;}
  .topbar .spacer{flex:1;}
  .role-switch{display:flex;align-items:center;gap:8px;}
  .role-switch select{background:#14304e;color:#fff;border:1px solid #2a4f73;border-radius:8px;padding:7px 10px;font-size:12px;font-family:var(--font);cursor:pointer;font-weight:600;}
  .user-chip{display:flex;align-items:center;gap:8px;background:#14304e;border-radius:20px;padding:4px 12px 4px 4px;font-size:11px;}
  .user-chip .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--ocean),var(--navy));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:12px;}
  .badge-vtc{background:#7f1d1d;color:#fecaca;font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700;}
  /* ===== Layout ===== */
  .shell{display:flex;min-height:calc(100vh - 54px);}
  .rail{width:230px;background:var(--ink);color:#cbd5e1;flex-shrink:0;padding:14px 0;position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto;}
  .rail-route{font-family:var(--mono);font-size:10px;color:#5b7799;padding:0 18px 4px;}
  .rail-ws{font-size:14px;font-weight:700;color:#fff;padding:0 18px 12px;border-bottom:1px solid #1e3a5a;margin-bottom:10px;}
  .rail-item{display:flex;align-items:center;gap:9px;padding:9px 18px;cursor:pointer;font-size:12.5px;border-left:3px solid transparent;transition:.12s;}
  .rail-item:hover{background:#14304e;color:#fff;}
  .rail-item.active{background:#14304e;color:#fff;border-left-color:var(--ocean);font-weight:600;}
  .rail-item .ico{font-size:15px;width:18px;text-align:center;}
  .rail-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700;}
  .rail-sec{font-size:10px;color:#5b7799;text-transform:uppercase;letter-spacing:0.5px;padding:14px 18px 6px;}
  .main{flex:1;padding:22px 26px;overflow-x:hidden;}
  /* ===== Common ===== */
  .page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;}
  .page-head h1{font-size:21px;color:var(--ink);font-weight:800;}
  .page-head .sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .page-head .right{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .btn{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.12s;}
  .btn-primary{background:var(--ocean);color:var(--ink);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-dark{background:var(--ink);color:#fff;}
  .kpi-row{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:140px;flex:1;}
  .kpi .lbl{font-size:11px;color:var(--muted);}
  .kpi .val{font-size:24px;font-weight:800;color:var(--ink);margin-top:2px;}
  .kpi .val.warn{color:var(--gold);} .kpi .val.bad{color:var(--red);} .kpi .val.good{color:var(--green);}
  .kpi .meta{font-size:10px;color:var(--muted);margin-top:2px;}
  .section-title{font-size:13px;font-weight:700;color:var(--ink);margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-title .tag{font-size:10px;font-weight:600;color:#fff;padding:2px 8px;border-radius:10px;}
  /* case cards */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;}
  .case-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.12s;border-left:4px solid var(--navy);}
  .case-card:hover{box-shadow:0 4px 16px rgba(11,31,58,.10);transform:translateY(-1px);}
  .case-card.full{border-left-color:var(--sky);}
  .case-card.simplified{border-left-color:var(--purple);}
  .cc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .cc-id{font-family:var(--mono);font-size:10px;color:var(--muted);}
  .cc-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px;}
  .cc-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text);margin-bottom:5px;flex-wrap:wrap;}
  .chip{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
  .chip-model-full{background:#E0F2FE;color:#0369A1;}
  .chip-model-simp{background:#F3E8FF;color:#6B21A8;}
  .chip-bg-opto{background:#E0F2FE;color:#0369A1;}
  .chip-bg-consumer{background:#F3E8FF;color:#6B21A8;}
  .sla{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .sla-green{background:var(--green);} .sla-yellow{background:var(--amber);} .sla-red{background:var(--red);}
  .stage-mini{display:flex;gap:3px;margin-top:8px;}
  .stage-dot{flex:1;height:5px;border-radius:3px;background:var(--line);}
  .stage-dot.done{background:var(--green);} .stage-dot.active{background:var(--amber);} .stage-dot.cur{background:var(--ocean);}
  /* inbox */
  .inbox{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .inbox-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;}
  .inbox-item:hover{background:var(--bg-soft);}
  .inbox-item:last-child{border-bottom:none;}
  .inbox-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .inbox-body{flex:1;} .inbox-body .t{font-size:12.5px;font-weight:600;color:var(--ink);} .inbox-body .d{font-size:11px;color:var(--muted);}
  .inbox-act{font-size:11px;color:var(--navy);font-weight:600;}
  /* table */
  table.grid{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  table.grid th{background:#F3F4F6;text-align:left;padding:8px 10px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--line);}
  table.grid td{padding:7px 10px;border-bottom:1px solid var(--line);}
  table.grid tr:last-child td{border-bottom:none;}
  table.grid tr:hover td{background:var(--bg-soft);}
  .masked{color:#cbd5e1;letter-spacing:1px;}
  /* tabs */
  .tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;}
  .tab{padding:9px 16px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;}
  .tab.active{color:var(--navy);border-bottom-color:var(--navy);}
  /* wizard */
  .wiz-steps{display:flex;gap:0;margin-bottom:20px;}
  .wiz-step{flex:1;text-align:center;position:relative;font-size:11px;}
  .wiz-step .n{width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 5px;}
  .wiz-step.active .n{background:var(--ocean);color:var(--ink);}
  .wiz-step.done .n{background:var(--green);color:#fff;}
  .wiz-step::after{content:'';position:absolute;top:15px;left:50%;width:100%;height:2px;background:var(--line);z-index:-1;}
  .wiz-step:last-child::after{display:none;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  .field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:12px;font-family:var(--font);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  /* handoff */
  .handoff{display:flex;align-items:stretch;gap:0;margin:16px 0;overflow-x:auto;padding-bottom:8px;}
  .ho-stage{min-width:150px;flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;margin-right:18px;}
  .ho-stage::after{content:'▶';position:absolute;right:-15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px;}
  .ho-stage:last-child{margin-right:0;}.ho-stage:last-child::after{display:none;}
  .ho-stage .s{font-size:10px;color:var(--muted);font-weight:700;}
  .ho-stage .nm{font-size:12px;font-weight:700;color:var(--ink);margin:2px 0;}
  .ho-stage .who{font-size:10px;color:var(--navy);}
  .ho-stage.cur{border-color:var(--ocean);border-width:2px;background:#F0FDFB;}
  .ho-stage.done{background:#F0FDF4;}
  .note{background:#FEF3C7;border:1px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:11px;color:#92400E;line-height:1.6;margin:12px 0;}
  .note.cyan{background:#ECFEFF;border-color:var(--cyan);color:#155E75;}
  .note.purple{background:#F3E8FF;border-color:var(--purple);color:#5B21B6;}
  .breadcrumb{font-size:11px;color:var(--muted);margin-bottom:10px;cursor:pointer;}
  .breadcrumb:hover{color:var(--navy);}
  .placeholder-flow{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:18px;}
  .flow-step{display:flex;gap:12px;padding:10px;border-radius:8px;}
  .flow-step:nth-child(even){background:var(--bg-soft);}
  .flow-step .fn{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;}
  .flow-step .ft{font-size:12px;font-weight:600;color:var(--ink);}
  .flow-step .fd{font-size:11px;color:var(--muted);margin-top:2px;}
  .pill-grid{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{font-size:10px;background:#EEF2F6;color:var(--navy);padding:4px 9px;border-radius:6px;font-family:var(--mono);}
  .ov-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .ov-tile{background:linear-gradient(135deg,var(--ink),#14304e);color:#fff;border-radius:12px;padding:16px;}
  .ov-tile .l{font-size:11px;color:#93b4d4;} .ov-tile .v{font-size:28px;font-weight:800;margin-top:4px;} .ov-tile .m{font-size:10px;color:#7da3c9;margin-top:3px;}
  .swimlane{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
  .swimlane .bg-name{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   Cortex Demo v0.13 — 角色工作區制(role workspace)
   取代 v0.12 單一 form · 對齊 cortex-role-workspace-sd.md
   ============================================================ */

// ---- BG / 使用者 ----
const BGS = {
  OPTO:     { name:'光電事業群',   color:'opto' },
  CONSUMER: { name:'消費電子事業群', color:'consumer' },
};

// ---- 10 角色定義 ----
const ROLES = {
  BPM:      { name:'BPM 業務專案經理', user:'Lisa 林', bg:'OPTO', bu:'MOUSE', route:'/quote/cockpit', ws:'我的報價案工作台', vtc:true,
              menu:[['cockpit','🏠','Cockpit 首頁'],['wizard','➕','開新報價案'],['tracker','📊','案進度儀表'],['invite','👥','角色邀請配置'],['gate','🚦','Gate 控制台',2],['costview','💰','成本檢視'],['quote','📤','報價 Console'],['handoff','🔗','端到端流程']] },
  RD:       { name:'RD 研發', user:'Troy 黃', bg:'OPTO', bu:'MOUSE', route:'/rd/desk', ws:'我的 BOM 工作台', vtc:false,
              menu:[['desk','🏠','BOM Desk 首頁'],['build','🧱','BOM 建置 4-step'],['module','🧩','Module Board'],['handoff','🔗','端到端流程']] },
  BUYER:    { name:'採購 Buyer(含 PKG)', user:'David 張', bg:'OPTO', bu:'MOUSE', route:'/buyer/cockpit', ws:'採購工作台', vtc:true,
              menu:[['cockpit','🏠','採購工作台'],['strategy','🎯','採購策略工作台'],['rfq','📋','RFQ 報價錄入'],['erp','🔍','ERP 歷史價'],['pkg','📮','PKG 配置'],['handoff','🔗','端到端流程']] },
  EPM:      { name:'EPM 廠製造工程經理', user:'Andy 陳', bg:'OPTO', bu:'MOUSE', route:'/epm/desk', ws:'EPM 製造工程工作台', vtc:true,
              menu:[['desk','🏠','工作台首頁'],['baseline','📅','廠 Baseline 維護'],['cleansheet','🧮','案級 Cleansheet'],['compute','⚙️','Compute & 廠 Lock'],['handoff','🔗','端到端流程']] },
  DPM:      { name:'DPM 開發總監', user:'Mike 王', bg:'OPTO', bu:'MOUSE', route:'/dpm/review', ws:'Cost Review 控制台', vtc:true,
              menu:[['inbox','🏠','Review 收件匣',1],['matrix','🔢','Cost Matrix 控制台'],['lockgate','🔒','BOM Lock Gate'],['secondsign','✍️','Baseline 漲幅二簽'],['handoff','🔗','端到端流程']] },
  SALES:    { name:'業務 Sales(兼 Finance)', user:'John 李', bg:'OPTO', bu:'MOUSE', route:'/sales/quote-desk', ws:'報價工作台', vtc:true,
              menu:[['desk','🏠','My Quotes 首頁'],['toquote','📝','待報價 To-Quote'],['nego','🔄','議價循環'],['margin','📈','Margin 稽核台'],['export','📤','客戶報價匯出'],['handoff','🔗','端到端流程']] },
  PROC_MGR: { name:'採購主管', user:'Karen 周', bg:'OPTO', bu:'MOUSE', route:'/proc/approval', ws:'採購審核台', vtc:true,
              menu:[['desk','🏠','Approval Desk'],['strategy','✅','採購策略審核'],['tier','💲','Price Tier 核可'],['benchmark','📊','跨案 Supplier 比價'],['handoff','🔗','端到端流程']] },
  ADMIN:    { name:'admin / IT', user:'Cortex Admin', bg:'HQ', bu:'IT', route:'/admin/cost-master', ws:'設定 Master 控制台', vtc:true, admin:true,
              menu:[['health','🏠','平台健康'],['baseline','📅','廠 Baseline'],['catalog','🏭','設備類別 Catalog'],['wage','👷','工資 Master'],['mask','🎛️','Costing Model × Mask'],['grant','🔐','權限 Grant']] },
  GM_BG:    { name:'總經理 / BG 高層', user:'David 總', bg:'OPTO', bu:null, route:'/portfolio', ws:'BG Portfolio 戰情中心', vtc:true, oversight:true,
              menu:[['overview','🏠','BG 戰情總覽'],['cases','📋','全案清單'],['redzone','🔴','卡關紅燈中心'],['margin','📈','Margin 風險雷達'],['funnel','🫗','Stage 流量漏斗']] },
  CHAIRMAN: { name:'董事長 / 集團最高', user:'Chairman', bg:null, bu:null, route:'/portfolio?scope=GLOBAL', ws:'集團 Portfolio 戰情儀表板', vtc:true, oversight:true, global:true,
              menu:[['overview','🏠','集團總覽'],['bgcompare','⚖️','BG 對比'],['browser','🌐','全集團專案瀏覽器'],['margin','📈','Margin 與雙價分析'],['boardpack','📑','匯出 Board Pack']] },
};

// ---- 共享案資料(同一案 · 不同角色看不同投影)----
const CASES = [
  { id:'QT-2026-0148', title:'SteelSeries Rival 3+ Wired Mouse', customer:'SteelSeries ApS', cust_alias:'S001',
    model:'FULL_MVA', bg:'OPTO', bu:'MOUSE', stage:6, sla:'yellow', margin:6.7, amount:'$4.96M', qty:'418K',
    factories:['CN','VN','TW'], variants:['black','white'], dims:24,
    cheapest:'VN-Black $11.106', lock:false },
  { id:'QT-2026-0167', title:'WHOOP Gen4 MP 穿戴手環', customer:'WHOOP Inc.', cust_alias:'W001',
    model:'SIMPLIFIED_WEARABLE', bg:'CONSUMER', bu:'WEARABLE', stage:5, sla:'yellow', margin:6.0, amount:'$8.96M', qty:'100K',
    factories:['CN'], variants:['midnight'], dims:5, skus:5, modules:8,
    cheapest:'Retail $89.55', lock:false },
  { id:'QT-2026-0155', title:'Razer Basilisk V3 Wired', customer:'Razer Inc.', cust_alias:'R002',
    model:'FULL_MVA', bg:'OPTO', bu:'MOUSE', stage:4, sla:'green', margin:null, amount:'$3.2M', qty:'250K',
    factories:['CN','VN'], variants:['black'], dims:8, lock:false },
];

const STAGES = ['立案','詢價','BOM','並行Collect','Cost Review','報價Gate','結案'];
const STAGE_OWNER = ['業務','業務','RD','採購∥EPM','DPM','業務','業務'];

// ---- state ----
let state = { role:'BPM', screen:'cockpit', activeCase:null, wizStep:1, csModel:'FULL_MVA', csFactory:'CN', salesTab:'toquote' };

function setRole(r){ const role=ROLES[r]; state.role=r; state.screen=role.menu[0][0]; state.activeCase=null; render(); }
function go(screen,caseId){ state.screen=screen; if(caseId!==undefined) state.activeCase=caseId; render(); }
function casesForRole(){
  const role=ROLES[state.role];
  if(role.global) return CASES;
  if(role.admin) return CASES;
  return CASES.filter(c=>c.bg===role.bg);
}
function caseById(id){ return CASES.find(c=>c.id===id); }
function mask(v,role){ return role.vtc ? v : '▒▒▒'; }

/* ============================================================ render ============================================================ */
function render(){
  const role=ROLES[state.role];
  document.getElementById('app').innerHTML = renderTop() + `<div class="shell">${renderRail()}<div class="main">${renderWorkspace()}</div></div>`;
}

function renderTop(){
  const role=ROLES[state.role];
  const bgName = role.global ? '集團(全 BG)' : role.bg==='HQ' ? '中央 HQ' : (BGS[role.bg]?.name||role.bg);
  return `
  <div class="topbar">
    <div class="logo">Cortex<span class="v">v0.13 角色工作區</span></div>
    <div class="spacer"></div>
    <div class="role-switch">
      <span style="font-size:11px;color:#7da3c9;">切換角色登入身分:</span>
      <select onchange="setRole(this.value)">
        ${Object.keys(ROLES).map(k=>`<option value="${k}" ${k===state.role?'selected':''}>${ROLES[k].name}</option>`).join('')}
      </select>
    </div>
    <div class="user-chip">
      <span class="av">${role.user[0]}</span>
      <div>
        <div style="font-weight:600;">${role.user}</div>
        <div style="color:#93b4d4;font-size:10px;">${bgName}${role.bu?' · '+role.bu:''}</div>
      </div>
      ${role.vtc?'<span class="badge-vtc">VIEW_TRUE_COST</span>':''}
    </div>
  </div>`;
}

function renderRail(){
  const role=ROLES[state.role];
  return `
  <div class="rail">
    <div class="rail-route">${role.route}</div>
    <div class="rail-ws">${role.ws}</div>
    ${role.menu.map(m=>`
      <div class="rail-item ${m[0]===state.screen?'active':''}" onclick="go('${m[0]}')">
        <span class="ico">${m[1]}</span><span>${m[2]}</span>
        ${m[3]?`<span class="badge">${m[3]}</span>`:''}
      </div>`).join('')}
    <div class="rail-sec">角色說明</div>
    <div style="padding:0 18px;font-size:10.5px;color:#7da3c9;line-height:1.6;">
      ${role.oversight?'唯讀 oversight · 看/drill 不交棒':role.admin?'平台管理 · 月度交付 master':'operational · 完成即交棒下一角色'}
    </div>
  </div>`;
}

function renderWorkspace(){
  const r=state.role, s=state.screen;
  if(s==='handoff') return renderHandoff();
  // dispatch by role
  const fn = WS[r] && WS[r][s];
  if(fn) return fn();
  return renderGenericFlow();
}

/* ============================================================ Workspace renderers ============================================================ */

/* ============================================================ shared components ============================================================ */
function head(title,sub,right){ return `<div class="page-head"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>${right?`<div class="right">${right}</div>`:''}</div>`; }
function kpis(arr){ return `<div class="kpi-row">${arr.map(k=>`<div class="kpi"><div class="lbl">${k[0]}</div><div class="val ${k[3]||''}">${k[1]}</div><div class="meta">${k[2]||''}</div></div>`).join('')}</div>`; }
function crumb(screen,label){ return `<div class="breadcrumb" onclick="go('${screen}')">← ${label}</div>`; }
function modelChip(m){ return m==='FULL_MVA'?`<span class="chip chip-model-full">FULL_MVA</span>`:`<span class="chip chip-model-simp">SIMPLIFIED</span>`; }
function bgChip(bg){ return `<span class="chip chip-bg-${bg.toLowerCase()}">${BGS[bg]?.name||bg}</span>`; }
function gateBtn(c){ return c.stage>=6?`<button class="btn btn-primary" onclick="go('gate')">🚦 Gate 控制台</button>`:''; }

function caseCard(c,target,readonly){
  const cls = c.model==='FULL_MVA'?'full':'simplified';
  return `<div class="case-card ${cls}" ${target?`onclick="go('${target}','${c.id}')"`:readonly?'style="cursor:default"':''}>
    <div class="cc-head"><span class="cc-id">${c.id}</span><span class="sla sla-${c.sla}"></span></div>
    <div class="cc-title">${c.title}</div>
    <div class="cc-row">${modelChip(c.model)} ${bgChip(c.bg)}</div>

    <div class="cc-row"><span>Stage ${c.stage} ${STAGES[c.stage]}</span>${c.margin!=null?`<span>· margin <b style="color:${c.margin<7?'var(--gold)':'var(--green)'}">${c.margin}%</b></span>`:''}</div>
    <div class="stage-mini">${STAGES.map((s,i)=>`<div class="stage-dot ${i<c.stage?'done':i===c.stage?'cur':''}"></div>`).join('')}</div>
  </div>`;
}

    return `<table class="grid"><thead><tr><th>SKU</th><th>BOM 小計</th><th>OH 4%</th><th>SGA 3%</th><th>Profit 3%</th><th>TTL quote</th></tr></thead><tbody>
      ${[['Retail','$80.96','$3.24','$2.43','$2.43','$89.55'],['WB Strap','$67.0','$2.68','$2.01','$2.01','$73.7']].map(r=>`<tr><td>${r[0]}</td><td class="mono">${mask(r[1],role)}</td><td class="mono">${mask(r[2],role)}</td><td class="mono">${mask(r[3],role)}</td><td class="mono">${r[4]}</td><td class="mono" style="font-weight:700">${r[5]}</td></tr>`).join('')}

  }
  return `<table class="grid"><thead><tr><th>廠 × variant</th><th>material true→quote</th><th>MVA</th><th>total quote</th><th>margin</th></tr></thead><tbody>

  </tbody></table>${!role.vtc?'<div class="note">⛔ 無 VIEW_TRUE_COST · true cost / margin 欄遮罩(▒▒)</div>':''}`;

function inviteGrid(){
  return `<table class="grid"><thead><tr><th>角色</th><th>受邀 user</th><th>負責 Stage</th><th>field_grants 預設(D3 角色 template)</th></tr></thead><tbody>

function renderGenericFlow(){
  const role=ROLES[state.role];
  const item=role.menu.find(m=>m[0]===state.screen);
  return head(item?item[2]:'(畫面)','此 menu 的 demo 畫面')+`<div class="placeholder-flow" style="text-align:center;color:var(--muted);padding:40px">🚧 ${role.ws} · ${item?item[2]:''}<br><span style="font-size:11px">此角色操作流程詳見 cortex-role-workspace-sd.md §3</span></div>`;
}

function renderHandoff(){
  return `${head('端到端流程 · Handoff 鏈','QUOTE 8 stage · BPM 是 gate 唯一確認人 · 各角色完成即交棒')}
  <div class="handoff">
    ${[['業務','發 RFQ','done'],['BPM','開案 8-stage','done'],['RD','Stage4 BOM','done'],['採購∥EPM','Stage5 Collect','cur'],['DPM','Stage6 lock+propagate',''],['業務','Stage7 報價',''],['業務','Stage8 結案','']].map(s=>`<div class="ho-stage ${s[2]}"><div class="s">${s[0]}</div><div class="nm">${s[1]}</div></div>`).join('')}
  </div>
  <div class="note">🔄 reprice 回圈:業務議價破底線 → 開新 stage iteration(D2)退 Stage5 → 採購重議 + EPM 重 compute + DPM 重 lock → 回 Stage7</div>
  <div class="note cyan">📊 oversight 旁路:DPM lock+propagate 後 margin/金額即時聚合進 GM(/portfolio)+ 董事長(/portfolio?scope=GLOBAL)· 唯讀 dead-end · 不交棒不推進</div>
  <div class="note purple">⚙️ admin 旁路:不在 stage 鏈 · 月度交付可信 master(baseline/類別/wage/權限)給所有作業角色</div>
  <div class="section-title">三案目前位置</div>
  <div class="card-grid">${CASES.map(c=>caseCard(c,null,true)).join('')}</div>`;
}
